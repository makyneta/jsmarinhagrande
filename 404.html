<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — JS Marinha Grande</title>
<meta name="description" content="Página não encontrada — JS Marinha Grande">
<link rel="icon" href="assets/images/ui/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --red:#C0181A; --red-dark:#8B0F11; --font-serif:'Playfair Display',serif; --font-sans:'Outfit',sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; background:#F7F5F2; font-family:var(--font-sans); display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased; }
  .wrap { text-align:center; padding:24px; max-width:420px; }
  .logo { width:80px; height:80px; display:flex; align-items:center; justify-content:center; background:#fff; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.04); margin:0 auto 24px; animation:fadeUp .5s ease .05s both; }
  .logo img { width:72%; height:72%; object-fit:contain; display:block; }
  .num { font-family:var(--font-serif); font-size:clamp(5rem,20vw,8rem); font-weight:900; color:var(--red-dark); line-height:.85; letter-spacing:-.04em; animation:fadeUp .5s ease .15s both; }
  .num::after { content:''; display:block; width:48px; height:3px; background:var(--red); margin:14px auto 0; border-radius:2px; }
  .sub { font-size:.82rem; font-weight:500; color:rgba(139,15,17,.35); letter-spacing:.1em; text-transform:uppercase; margin-top:20px; margin-bottom:28px; animation:fadeUp .5s ease .3s both; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 28px; background:var(--red); color:#fff; border-radius:40px; text-decoration:none; font-size:.84rem; font-weight:600; box-shadow:0 4px 20px rgba(192,24,26,.25); transition:transform .25s,box-shadow .25s,background .2s; animation:fadeUp .5s ease .45s both; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(192,24,26,.3); background:var(--red-dark); }
  .btn svg { width:14px; height:14px; transition:transform .25s; }
  .btn:hover svg { transform:translateX(3px); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <img src="assets/images/ui/profile.jpg" alt="JS Marinha Grande" onerror="this.style.display='none'">
  </div>
  <div class="num">404</div>
  <div class="sub">Página não encontrada</div>
  <a href="index.html" class="btn">
    Voltar ao início
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
  </a>
</div>

<script>
var ROUTES = {
  '/jsinstagram': 'https://www.instagram.com/js.marinhagrande',
  '/jsfacebook':  'https://www.facebook.com/jsocialistamg',
  '/juventudesocialistanacional':'https://juventudesocialista.pt',
};
var path = window.location.pathname.toLowerCase().replace(/\/$/,'').replace(/^\/jsmarinhagrande/,'');
var dest = ROUTES[path];
if (dest) window.location.replace(dest);
else window.location.replace('index.html');
</script>
</body>
</html>
